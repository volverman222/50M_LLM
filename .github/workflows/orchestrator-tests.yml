name: Orchestrator and data protocol tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/experiment_orchestrator/**'
      - 'configs/**'
      - 'schemas/**'
      - 'pyproject.toml'
      - '.github/workflows/orchestrator-tests.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      WANDB_MODE: disabled
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      PYTORCH_NVML_BASED_CUDA_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[training,dev]' -e 'tools/experiment_orchestrator[dev]'
      - run: python -m pytest tests tools/experiment_orchestrator/tests --import-mode=importlib -q -rs
